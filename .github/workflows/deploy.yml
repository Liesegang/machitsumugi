name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generation-matrix:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.suites.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Discover complete-city test suites
        id: suites
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readdirSync } from 'node:fs';
          const files = readdirSync('src/domain')
            .filter(file => /^generator.*\.test\.ts$/.test(file))
            .sort().map(file => `src/domain/${file}`);
          if (!files.length) throw new Error('No generation test suites found');
          appendFileSync(process.env.GITHUB_OUTPUT, `files=${JSON.stringify(files)}\n`);
          NODE

  unit:
    name: Domain checks (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test algorithms, history and saved projects
        run: npm run test:unit -- --shard=${{ matrix.shard }}/2

  generation:
    name: City generation (${{ matrix.file }})
    needs: generation-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.generation-matrix.outputs.files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # A full-city file is the scheduling unit. The reproducibility case still
      # generates three independent worlds; no cache, checks or seeds are removed.
      - name: Test complete coupled landscapes and cities
        run: npm exec -- vitest run "${{ matrix.file }}"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [build, unit, generation]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
